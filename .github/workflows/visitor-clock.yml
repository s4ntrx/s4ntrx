
name: Visitor clock

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Render the digital clock from the visitors badge
        run: node .github/scripts/visitor-clock.mjs
        env:
          GH_USER: s4ntrx

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and push visitor clock
        run: |
          git add assets/visitor-clock.svg
          git commit -m "Update visitor clock" || exit 0
          git push
